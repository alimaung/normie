<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <title>Businessmap API Documentation - Offline</title>
    <script src="application-v1110_resources_libs_stoplight_web-components.min.js" type="application/javascript"></script>
    <link href="application-v1110_resources_libs_stoplight_styles.min.css" rel="stylesheet"/>
    <style>
        /* Hide the "Powered by Stoplight" branding */
        a[href*="stoplight.io"] {
            display: none;
        }

        /* Hide the "Security" section from the Overview */
        div[data-test="security"] {
            display: none;
        }

        /* Hide the "Additional Information" section from the Overview */
        div[data-test="additional-info"] {
            display: none;
        }

        /* Make sidebar scrollable */
        .sl-elements-api > div.sl-flex > div.sl-flex-col {
            max-height: 100vh;
        }
        
        /* Fallback message styling */
        .fallback-message {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        .fallback-message h1 {
            color: #0066cc;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 10px;
        }
        
        .fallback-message .error {
            background: #ffe6e6;
            border: 1px solid #ff9999;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .fallback-message .instructions {
            background: #f0f8ff;
            border: 1px solid #b3d9ff;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .fallback-message ol {
            margin-left: 20px;
        }
        
        .fallback-message code {
            background: #f5f5f5;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <elements-api 
        apidescriptionurl="openapi.json" 
        hideschemas="true" 
        layout="responsive" 
        logo="favicon.ico" 
        router="hash">
    </elements-api>
    
    <!-- Fallback content if the API documentation doesn't load -->
    <noscript>
        <div class="fallback-message">
            <h1>Businessmap API Documentation (Offline)</h1>
            <div class="error">
                <strong>JavaScript Required:</strong> This API documentation requires JavaScript to function properly.
            </div>
        </div>
    </noscript>
    
    <script>
        // Fallback error handling
        window.addEventListener('error', function(e) {
            console.error('Error loading API documentation:', e);
        });
        
        // Check if the main component loaded after a delay
        setTimeout(function() {
            var apiElement = document.querySelector('elements-api');
            if (apiElement && !apiElement.shadowRoot) {
                console.warn('API documentation may not have loaded properly');
                // Could show a fallback message here
            }
        }, 3000);
    </script>
</body>
</html>
