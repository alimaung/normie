<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <style type="text/css">

        body {
            font-size: 10pt !important;
            font-family: Sans-Serif, serif !important;
        }

        .container {
            height: 30px;
            width: 100%;
            border-bottom: 1px solid;
            display: table
        }

        .left {
            float: left;
            height: 100%;
            width: 32%;
            text-align: left;
            display: table;
            word-wrap: break-word
        }

        .right {
            float: right;
        }

        .child {
            vertical-align: bottom;
            display: table-cell;
        }

        .center {
            float: left;
            height: 100%;
            width: 33%;
            font-weight: bold;
            display: table;
            text-align: center
        }

		.pubHeaderLogo {
		    margin-left: 5px;
		    margin-top: 5px;
		}

		#pubHeader {
		    width: 90%;
		    height: 85%;
		    border: solid black 1pt;
		    font-size: 8pt;
		    margin-left: 50px;
		    margin-top: 5px;
		}

		.taskHeaderCenter {
		    text-align: center;
		    margin-top: 0.25em;
		    margin-bottom: 0.25em;
		}

		.taskHeaderBold {
		    font-weight: bold;
		}

		.taskHeaderRight {
		    text-align: right;
		    margin-right: 0.25em;
		    margin-top: 0.25em;
		    margin-bottom: 0.25em;
		}

		.taskHeaderLeft {
		    margin-left: 0.25em;
		    margin-top: 0.25em;
		    margin-bottom: 0.25em;
		}

		.dmHeaderCenter {
		    text-align: center;
		    margin-top: 0.25em;
		    margin-bottom: 0.25em;
		}		

		.dmHeaderRight {
		    text-align: right;
		    margin-right: 0.25em;
		    margin-top: 0.25em;
		    margin-bottom: 0.25em;
		}

		.dmHeaderLeft {
		    margin-left: 0.25em;
		    margin-top: 0.25em;
		    margin-bottom: 0.25em;
		}
				
        body {
            margin-bottom: 0px
        }
    </style>
    <script type="text/javascript">
        function dynVar() {
            var vars = {};
            var params = document.location.search.substring(1).split('&');

            for (var i in params) {
                var paramArr = new Array();
                var splitLen = params[i].indexOf('=');
                paramArr[0] = params[i].substring(0, splitLen);
                paramArr[1] = params[i].substring(splitLen + 1);
                vars[paramArr[0]] = paramArr[1];
            }

            var tagValues = ['delimiter', 'break'];
            if (vars['pp-printing-header-revisionLabel'] != 'null' && vars['pp-printing-header-releaseDateLabel'] != 'null'){
               tagValues.push('rev-delimiter');
            }
            tagValues.forEach(processData, 'tags');

            var titleValues = ['pp-printing-header-libraryTitle','pp-printing-header-publicationTitle', 'pp-printing-header-companyTitle'];
            titleValues.forEach(processData, 'body');

            var customValues = ['pp-printing-header-revisionLabel', 'pp-printing-header-revNum', 'pp-printing-header-releaseDateLabel',
                'pp-printing-header-revdate', 'pp-printing-header-initiatedUserLabel', 'pp-printing-header-initiatedUser', 'pp-printing-header-firstName', 'pp-printing-header-lastName'];
            if (vars.showPrintPDFRevisionDetails == 'true') {
                customValues.forEach(processData, 'body');
            } else {
                customValues.forEach(processData, 'style');
            }

            var printDateTime = decodeURI(vars.printDateTime);
            if (printDateTime) {
                var printDateTimeValues = ['pp-printing-header-printedLabel', 'pp-printing-header-printDateTime'];
                printDateTimeValues.forEach(processData, 'body');
            }

            function processData(value, index, array) {
                var x = document.getElementsByClassName(value);
                if (x && x.length > 0) {
                    if (this == 'tags') {
                        for (var i = 0; i < x.length; i++) {
                            x[i].innerHTML = value && value == 'break' ? '<br/>' : ' : ';
                        }
                    } else if (this == 'body') {
					    if (vars[value] != 'null'){
                           x[0].innerHTML = decodeURI(vars[value]);
						}
                    } else if (this == 'style') {
                        x[0].style.display = 'none';
                    }
                }
            }

            document.body.style.fontSize = vars.headerFontSize;
            displayMetadata();

            addRepeatedHeaderContent(vars['pp-printing-header-repeatedContent'], vars['pp-printing-header-clientLogoPath'], vars['page']);
        }
		
	    function displayMetadata() {
            var vars = {};
            var params = document.location.search.substring(1).split('&');
            for (var i in params) {
                var paramArr = new Array();
                var splitLen = params[i].indexOf('=');
                paramArr[0] = params[i].substring(0, splitLen).toLowerCase();
                paramArr[1] = params[i].substring(splitLen + 1);
                vars[paramArr[0]] = paramArr[1];
            }

            displayProprietaryMessage(vars);
        }

        function displayProprietaryMessage(vars) {
            if(vars['proprietary'] !== undefined) {
                var proprietaryElement = document.getElementsByClassName(vars['proprietary'].toLowerCase());
                if (proprietaryElement && proprietaryElement.length > 0) {
                    proprietaryElement[0].style.removeProperty("display");
                }
            }
        }

      function addRepeatedHeaderContent(repeatedHeaderContent, clientLogoPath, currentPageNumber) {
			if(repeatedHeaderContent !== null && repeatedHeaderContent !== 'null' && repeatedHeaderContent !== undefined && repeatedHeaderContent.length > 0) {
				document.getElementById('pubHeader').innerHTML = decodeURIComponent(repeatedHeaderContent);
				injectClientLogo(clientLogoPath);
			} else {
				document.getElementById('pubHeader').style.display = 'none';
			}		
      }

      function injectClientLogo(clientLogoPath) {
       		if(clientLogoPath !== null && clientLogoPath !== 'null' && clientLogoPath !== undefined && clientLogoPath.length > 0) {
				var img = document.createElement('img');
				img.src = decodeURI(clientLogoPath);
				var clientLogoDiv = document.getElementsByClassName('pubHeaderLogo')[0];
				clientLogoDiv.appendChild(img);
			}
       	}
      
    </script>
</head>

<body onload="dynVar()" pp-header-height="18mm">
<div class="container">
    <div class="left" style="font-size: 80%">
        <div class="child" id="pp-printing-header">
            <span class="pp-printing-header-companyTitle"></span>
            <span class="break"></span>
            <span class="pp-printing-header-printedLabel"></span><span class="delimiter"></span><span
                class="pp-printing-header-printDateTime"></span>
            <span class="break"></span>
            <span class="pp-printing-header-revisionLabel"></span><span class="rev-delimiter"></span><span
                class="pp-printing-header-revNum"></span>
            <span class="break"></span>
            <span class="pp-printing-header-releaseDateLabel"></span><span class="rev-delimiter"></span><span
                class="pp-printing-header-revdate"></span>
        </div>
    </div>
    <div class="center" style="font-size: 90%">
        <div class="child">
            <span class="pp-printing-header-libraryTitle"></span><span class="break"></span>
            <span class="pp-printing-header-publicationTitle"></span>
        </div>
    </div>
	<div class="pubHeader" id="pubHeader"></div>
</div>
</body>
</html>
