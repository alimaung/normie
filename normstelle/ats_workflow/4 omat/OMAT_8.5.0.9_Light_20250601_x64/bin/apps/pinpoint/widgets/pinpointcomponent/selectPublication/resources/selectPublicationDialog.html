<div id="selectPublicationDialog">

        <p>{{translations.resultApplicableForMultiplePubs}}</p>
    </div>
    <div class="list-group">
        <a class="list-group-item list-group-item-action" style="cursor: pointer" ng-repeat="publication in publications"

    </div>
</div>
