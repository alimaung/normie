<html>
<head>
    <script src="../../../lib/pdf/pdfobject.js"></script>
    <script>
        function load(){
            var pdfUrl = localStorage.getItem("pdfUrl");
            new PDFObject({
                url: pdfUrl,
                width: '100%',
                height: '100%',
                pdfOpenParams: {
                    scrollbars: '1',
                    toolbar: '0',
                    navpanes: '1',
                    zoom: '100'
                }
            }).embed("pdf")            
        }

        function pdfLoadingComplete(){
            parent.pdfhideLoading();
            var redrawInterval = window.setInterval(redraw, 500);
            window.setTimeout(function() {
              window.clearInterval(redrawInterval);
            }, 10000);
          }

        function redraw() {
          parent.$('body').hide().show(0);
        }

        function getBrowserType() 
        {
            //Check Edge browser first to resolve conflict with Chrome and Safari
            if (navigator.userAgent.indexOf('Edge') != -1)
                return "Edge";
            else if(navigator.userAgent.indexOf('Firefox') != -1)
                return "Firefox";
            else if(navigator.userAgent.indexOf('Chrome') != -1)
                return "Chrome";
            else if(navigator.userAgent.indexOf('OPR') != -1)
                return "Opera";
            else if(navigator.userAgent.indexOf('Safari') != -1)
                return "Safari";
            else if(navigator.userAgent.indexOf('MSIE') != -1)
                return "IE";
            else if(!!navigator.userAgent.match(/Trident.*rv[ :]*11\./))
                return "IE";
            else
                return null;
        }        
    </script>
</head>
<body onload="load()">
    <div id="pdf"></div>
</body>
</html>
