<head>
<style>
    .fix-ranger {
        position: relative !important;
    }
    .wrlToolbarContainer {
        position: absolute !important;
        bottom: 0px;
        width: 100%;
        height: 100%;
        text-align: center;		
        

    }
    .wrlProgres {
        position: absolute;

        top: 40%;
        left: 40%;
        width: 80px;
        height: 80px;
		line-height: 80px;
        vertical-align: center;
        text-align: center;
        margin: 16px
    }
    .printToPdf {
        position: absolute;
        background-color: transparent;
        padding-top: 2em;
        max-width: 200px;
    }
    .wrlLoader {
        border: 16px solid #f3f3f3;
        border-radius: 50%;
        border-top: 16px solid #3498db;
        width: 80px;
        height: 80px;
        -webkit-animation: spin 2s linear infinite; /* Safari */
        animation: spin 2s linear infinite;
        position: absolute;
        top: 40%;
        left: 40%;
        }

        /* Safari */
        @-webkit-keyframes spin {
        0% { -webkit-transform: rotate(0deg); }
        100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
     }
    </style>
    <script language="javascript" src="widgets/graphic/lib/cortonasolo_prop.js"></script>
    <script language="javascript" src="widgets/graphic/lib/cortona-solo/Cortona3DSolo.js"></script>
</head>
<body >
<div>
    <div class="wrlProgres"><span id="wrlProgressCurrent">0</span>/<span id="wrlProgressTotal">100</span></div>
    <div class="wrlLoader" id="wrlLoader"></div>
</div>
<div class="wrlToolbarContainer" id="container">
    
        
       
        <canvas id="wrlCanvas" dimensions="{{print3dWidth}},{{print3dHeight}}">

             
        </canvas>

        <div class="panel" style="width:100%; left:0;z-index: 22;position: absolute;background-color: transparent;">
            <table id="cortonaFrame" style="width:100%; height:100%">
                <tbody>
                    <tr style="height:100%">
                        <td colspan="2" id="cortona_holder">
                            <div id="cContainer" class="app-container">
                                <div class="app-scene cortona3d-container wait" id="scene2d">
                                    <div class="app-scene cortona3d-container" id="scene3d">
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <!--<canvas oncontextmenu="event.preventDefault()" class="fix-ranger cortona3dsolo-canvas" height="319" width="587" style="display: block; position: absolute; touch-action: none;" touch-action="none"></canvas>
                    <input type="range" min="0" max="100" value="0" step="0.1" style="width: 99%; margin: 0px 1mm; height: 7mm; padding: 0px; display: block;">-->
                    <tr id="control_bar" style="display: none;">
						<td height="10" align="left" valign="middle" nowrap="true">
							<table style="width:100%; height:100%">
							<tr style="height:100%">
								<td colspan="2">
									<div id="toolbar-range" class="cortona3dsolo-popover">
										<input id="toolbar-range-input" type="range" style="width:75%">
									</div>
								</td>
							</tr>
							<tr style="height:100%">
								<td height="10" align="left" valign="middle" nowrap="true"><span id="cntr2D" style="display:none;"><input id="btn_3D" type="button" title="3D" value="3D" class="btn_control" onclick="show3D();"></span>
								<span id="cntr3D1"><input id="btn_play" type="button" title="{{'graphic.title.play' |translate}}" value="{{'graphic.title.play' |translate}}" class="btn_control" onclick="play();">
								<input
								id="btn_pause" type="button" title="{{'graphic.title.pause' |translate}}" value="{{'graphic.title.pause' |translate}}" class="btn_control" onclick="pause();"><input id="btn_stop" type="button" title="{{'graphic.title.stop' |translate}}" value="{{'graphic.title.stop' |translate}}" class="btn_control" onclick="stop();"
                                style="font-weight: bold;"></span>&nbsp;&nbsp;</td>
								
								<td height="10" align="left" class="captions"><span id="cntr3D2"><span id="speedspan" style="background-color: #ffffff;"><span id="speed_label" title="">{{'graphic.title.speed' |translate}}:</span>
								<input type="radio" name="speed_ratio_selector" id="speed1" title="" value="0.5" onclick="setSpeedRatio(0.5);">
								<label id="speed1_label" title="" for="speed1">x1/2</label><input type="radio" name="speed_ratio_selector"
                                id="speed2" title="" onclick="setSpeedRatio(1);" value="1" checked="true"><label id="speed2_label"
                                title="" for="speed2">x1</label>
								<input type="radio" name="speed_ratio_selector" title="" onclick="setSpeedRatio(2);" id="speed3" value="2">
								<label id="speed3_label" title="" for="speed3">x2</label>&nbsp;</span>
								</span>
								</td>
							</tr>
							</table>
						</td>
					</tr>
                    <tr id="control_bar_ipc" style="display: none;">
                        <td height="10" align="left" valign="middle" nowrap="true">
                            <span id="sheetSelect"><label id="choice_sheet_label" title="" for="choice_sheet">Sheet: </label>
                                <select id="choice_sheet" title="Select sheet" onchange="selectSheet(this)"></select>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    <div class="printToPdf">
        <button id="printPdfButton">{{'graphic.title.printToPdf' |translate}}</button>
    </div>
    </div>

</body>
