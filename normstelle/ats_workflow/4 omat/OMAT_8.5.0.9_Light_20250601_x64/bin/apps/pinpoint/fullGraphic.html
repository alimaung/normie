<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height, target-densitydpi=device-dpi" />
    <title>Full Graphic</title>
    <!--<link rel="stylesheet" href="css/v2.css"/>-->
    <!-- <script src="lib/jqm/jquery-2.0.3.js"></script> -->
    <script src="bower_components/jquery/jquery.min.js"></script>
    <!-- <script src="lib/jqm/jquery.mobile-1.4.2.min.js"></script> -->
    <script>
        var originalWidth;
        var originalHeight;
        var reloadGraphic = function(graphicContent){
            $(".ui-loader").hide();
            document.getElementById("full_graphic_blank").innerHTML = graphicContent;
            setTimeout(initGraphic, 100);
            self.focus();
            setTimeout(svgTextBind, 1000);
        }

        $(window).bind( 'orientationchange', function(e){
            fitGraphic();
        });

        function hideLoading(){
            isShowLoading = false;
            $(".ui-loader-background").remove();
            setTimeout(function() {
                $.mobile.loading('hide');
            }, 100);
        }

        var initGraphic = function(){
            var img = $('#full_graphic_blank').find("img");
            originalWidth = img.width();
            originalHeight = img.height();
            fitGraphic();
        }

        var fitGraphic = function(){
            var maxWidth = getViewportSize().width;
            var maxHeight = getViewportSize().height;
            var hRatio;
            var wRatio;
            var Ratio = 1;
            if(originalHeight == null || originalWidth == null || originalHeight == 0 || originalWidth == 0) return;
            var w = originalWidth;
            var h = originalHeight;
            wRatio = maxWidth / w;
            hRatio = maxHeight / h;
            if (maxWidth ==0 && maxHeight==0){
                Ratio = 1;
            }else if (maxWidth==0){//
                if (hRatio<1) Ratio = hRatio;
            }else if (maxHeight==0){
                if (wRatio<1) Ratio = wRatio;
            }else if (wRatio<1 || hRatio<1){
                Ratio = (wRatio<=hRatio?wRatio:hRatio);
            }
            if (Ratio<1){
                w = w * Ratio;
                h = h * Ratio;
            }

            $('#full_graphic_blank').find("img").width(w);
            $('#full_graphic_blank').find("img").height(h);
        }

        var svgTextBind = function(){



            var reFin=/^(\d+[a-zA-Z]+\w*|[a-zA-Z]+\d+\w*)$/;
            var reATA=/\(?\d{2}-\d{2}-\d{2}[) $]?/;
            var eventName = "ontouchstart" in document.documentElement ? "touchstart" : "click";
            $('#full_graphic_blank text').each(function() {
            	$(this).attr("svg-text-highlight", "F");
            	$(this).attr("original-fill", getFill(this));
        		$(this).attr("original-font-weight", getFontWeight(this));
        		$(this).attr("original-font-size", getFontSize(this));
        	});
            $('#full_graphic_blank text').on(eventName, function( e ) {
            	e.preventDefault();
                e.stopImmediatePropagation();
                var selectText = $(this).text().trim();
                var fontSize = 0;
                if(reATA.test(selectText))
                {
                    var reExATA = /\d{2}-\d{2}-\d{2}/;
                    selectText = reExATA.exec(selectText)+"";
                    self.blur();
                    if ($(this).attr("svg-text-highlight") === "T") {
                    	window.parent.opener.openATAPageFromSVG(selectText);
                    } else {
                    	$('#full_graphic_blank text').each(function() {
                    		$(this).attr("svg-text-highlight", "F");
                    		$(this).attr("fill", $(this).attr("original-fill"));
                    		$(this).attr("font-weight", $(this).attr("original-font-weight"));
                    		$(this).attr("font-size", $(this).attr("original-fill"));
                    	});
                    	$(this).attr("svg-text-highlight", "T");
                    	$(this).attr("fill", "#5cb85c");
                    	$(this).attr("font-weight", "bold");
                    	fontSize = getFontSize(this);
                    	$(this).attr("font-size", (fontSize * 1.2).toString());
                    }
                }
                else if(reFin.test(selectText))
                {
                    self.blur();
                    if (window.parent.opener.isShowWiringSearch()) {
                		if ($(this).attr("svg-text-highlight") === "T") {
                			window.parent.opener.openWiringSearchFromSVG(selectText);
                        } else {
                        	$('#full_graphic_blank text').each(function() {
                        		$(this).attr("svg-text-highlight", "F");
                        		$(this).attr("fill", $(this).attr("original-fill"));
                        		$(this).attr("font-weight", $(this).attr("original-font-weight"));
                        		$(this).attr("font-size", $(this).attr("original-fill"));
                        	});
                        	$(this).attr("svg-text-highlight", "T");
                        	$(this).attr("fill", "#5cb85c");
                        	$(this).attr("font-weight", "bold");
                        	fontSize = getFontSize(this);
                        	$(this).attr("font-size", (fontSize * 1.2).toString());
                        }
                	}
                }

            });
        }

        function getViewportSize() {
            var width = null;
            var height = null;

                if(!(document.documentElement.clientWidth == 0)){
                    width = document.documentElement.clientWidth;
                    height = document.documentElement.clientHeight;
                } else{
                    width = document.body.clientWidth;
                    height = document.body.clientHeight;
                }

            return {"width":width, "height":height};
        }

        function getFontSize(elem) {
        	var fontSizeStr = window.getComputedStyle(elem, null).getPropertyValue("font-size");
        	if (isBlank(fontSizeStr))
        		return 72;
        	var unitIndex = fontSizeStr.search(/\D/);
        	if (unitIndex == -1)
        		return parseInt(fontSizeStr);
        	else
        		return parseInt(fontSizeStr.substring(0, unitIndex));
        }

        function getFontWeight(elem) {
        	var fontWeight = window.getComputedStyle(elem, null).getPropertyValue("font-weight");
        	if (isBlank(fontWeight))
        		return "normal";
        	return fontWeight;
        }

        function getFill(elem) {
        	var fill = window.getComputedStyle(elem, null).getPropertyValue("fill");
        	if (isBlank(fill))
        		return "rgb(0, 0, 0)";
        	return fill;
        }

        function isBlank(str) {
        	return !str || (str.trim().length == 0);
        }

    </script>

</head>
<body>
<div id="full_graphic_blank" class="panzoom" style="width: 100%;height: 100%;text-align: center" >
        <h1 id="fullGraphicLoading"> Loading Graphic </h1>

</div>

</body>
</html>
