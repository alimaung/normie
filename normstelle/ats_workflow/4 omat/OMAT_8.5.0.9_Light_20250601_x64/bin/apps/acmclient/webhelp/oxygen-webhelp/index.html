<!DOCTYPE html SYSTEM "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
<!-- Paul - http://stackoverflow.com/questions/49547/making-sure-a-web-page-is-not-cached-across-all-browsers - HTML files are set to not cache so that pages are always refreshed to the latest version on server -->
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
<!-- Paul End -->
        <title>WebHelp</title>
			<meta HTTP-EQUIV="REFRESH" content="0; url=../"/>        
    </head>

<div id="productInfo" style="display:none;">

<!-- /to be generated  -->
                 
	<script type="text/javascript">
    var pageSearch = window.location.href;
    var pageWSearch = pageSearch.replace(window.location.search,"");
    pageWSearch = pageWSearch.replace(window.location.hash,"");
    var url=pageWSearch.split("/");
    var newUrl="";
    for ( var i = 0; i < url.length; i++) {
    	if (url[i]=='oxygen-webhelp'){
    		break;
    	}else{    	    		
				newUrl=newUrl+url[i]+"/";
    	}
		}    
    document.location=newUrl;
    </script>                                             
    </body>
</html>
